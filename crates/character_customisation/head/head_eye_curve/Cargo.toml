[package]
name = "head_eye_curve"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Prototype: the eye opening built from a curve on the eyeball, set by ten handles, with the skin round it and a lid piece that closes over the curve. A preview for viewer 2 only; the live head does not use it."

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"

[[bin]]
name = "eye_curve_check"
path = "src/bin/eye_curve_check.rs"
