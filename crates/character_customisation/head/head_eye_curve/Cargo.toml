[package]
name = "head_eye_curve"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The eye opening built from a curve on the eyeball, set by ten handles, with the skin round it, the lid piece that closes over the curve, and the finer triangles below the lower lids. `head_sliders` builds every head's eyes through it."

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"

