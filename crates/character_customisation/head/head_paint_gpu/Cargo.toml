[package]
name = "head_paint_gpu"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The head paint of head_paint, painted on the GPU with wgpu and WGSL shaders, natively and in the browser through WebGPU."

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[dependencies]
head_paint = { path = "../head_paint" }
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "webgpu"] }
futures-channel = "0.3"
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
image.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
