[package]
name = "head_rig"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The rig of a customized head: KOTOR's face bones placed on the head's own shape, and the teeth that the jaw moves."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image.workspace = true
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg", "rayon"] }
head_paint = { version = "0.0.0", path = "../head_paint" }
nalgebra.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"

[lints]
workspace = true

[[bin]]
name = "mouth_rig"
path = "src/bin/mouth_rig.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"
